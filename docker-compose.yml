services:
  compose-backend:
    container_name: compose-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3003:3003"
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    container_name: compose-mongo
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
